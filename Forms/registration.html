<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below register.</p>
    <hr>
    <form>
    <h2>Personal Details</h2>

    <label for="name">First Name:</label>
    <input type="text" name="Name" id="name" placeholder="eg: Tanmay">
    <br><br>

    <label for="lastname">Last Name:</label>
    <input type="text" name="lastName" id="lastname" placeholder="eg: kapoor">
    <br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date">
    <br><br>

    <label for="gen">Gender:</label>
    <br>
    <input type="radio" name="gender" id="male" value="Male">
    <label for="male">Male</label>
    <br>
    <input type="radio" name="gender" id="female" value="female">
    <label for="female">Female</label>
    <br>
    <input type="radio" name="gender" id="other" value="Other" >
    <label for="other">Other</label>

    <h3>Upload Your File:</h3>
    <input type="file">
    <hr>
    
    <h2>Contact Information</h2>

    <label for="email">Email Address:</label>
    <input type="text" name="Email" id="email" placeholder="eg: you@gmail.com">
    <br><br>
    <label for="number">Phone Number:</label>
    <input type="tel" name="Mobile Number" id="number" placeholder="eg: 9145678902">
    <br><br>


    <label for="mailing">Mailing Address:</label>
    <br>
    <textarea name="Address" id="mailing" rows="10" cols="20" placeholder="Street Address,city pincode,etc"></textarea>

     <hr>

     <h2>Academic Information</h2>
     <label for="course">Select your course:</label>
     <br>
     <select name="course" id="course">
        <option value="cse"">CSE</option>
        <option value="AiML">AIML</option>
        <option value="Cyber">Cyber</option>
     </select>
     <br><br>
     <label for="">Extracurricular Activities:</label>
     <br>
     <input type="checkbox" name="Extracurricular" id="sports" value="sports">
     <label for="sports">Sports</label>
     <br>
     <input type="checkbox" name="Extracurricular" id="music" value="music">
     <label for="music">Music & Art</label>
     <br>
     <input type="checkbox" name="Extracurricular" id="clubs" value="Clubs">
     <label for="clubs">Technology Clubs</label>
     <br>
     <input type="checkbox" name="Extracurricular" id="volunteer" value="Volunteer">
     <label for="volunteer">Volunteering</label>
      <br><br>

      <hr>

      <br>

      <h2>Create Your Account</h2>

      <label for="password">Create a Password:</label>
      <input type="password" name="NewPassword" id="password">
      <br><br>

      <label for="security">Security Question:</label>
      <select name="Security Question" id="security">

        <option value="petname">What is your pet name</option>
        <option value="school">In which school you are studing</option>


      </select>
      <br><br>

      <label for="answer">Security Answer:</label>
      <input type="text" name="Answer" id="answer">

      <br><br>

      <input type="checkbox" name="Terms&condition" id="terms">
      <label for="terms">I agree to the terms & condition</label>

      <br><br>
      <hr>
      <input type="submit" value="Register">
      <input type="reset" value="Clear Form">





    </form>

    

</body>
</html>
