<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- with audio and video tags we can import any audio and video that is present in our file -->
    <audio controls>
        <source src="./tanmayaudio.ogg" type="audio/ogg" >
    </audio>

    <video controls height="200px">
        <source src="./tanmayvideo.mp4"  type="video/mp4">
    </video>

    <!-- This is iframe with this we can import any youtube video into our website by writing embed  -->
     <!-- For fullscreen we have to use (alllowfullscreen) keyword -->

    <iframe src="https://youtube.com/embed/NGYp1zCBthk?si=HiWxQJyzO8FrATYE" frameborder="0" allowfullscreen></iframe>
    
</body>
</html>
